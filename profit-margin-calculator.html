
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Free profit margin calculator. Calculate profit, profit margin and markup from cost and selling prices.">
<title>Profit Margin Calculator – Toolora</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f7f9fc;color:#172033}
header{background:white;padding:20px 8%;border-bottom:1px solid #e5eaf2}
.logo{font-size:25px;font-weight:bold;color:#2563eb;text-decoration:none}
main{max-width:650px;margin:55px auto;padding:20px}
h1{text-align:center}
.intro{text-align:center;color:#64748b;line-height:1.6}
.card{background:white;padding:28px;border:1px solid #e5eaf2;border-radius:16px;margin-top:30px}
label{display:block;font-weight:bold;margin:18px 0 8px}
input{width:100%;padding:13px;border:1px solid #cbd5e1;border-radius:8px;font-size:17px}
.results{background:#eff6ff;padding:20px;border-radius:10px;margin-top:24px}
.result{display:flex;justify-content:space-between;gap:10px;margin:12px 0}
.value{font-weight:bold;color:#2563eb}
footer{text-align:center;padding:30px;color:#64748b;font-size:13px}
</style>
</head>
<body>
<header><a class="logo" href="index.html">Toolora</a></header>
<main>
<h1>Profit Margin Calculator</h1>
<p class="intro">Calculate your profit, profit margin and markup percentage using your cost and selling prices.</p>
<section class="card">
<label for="cost">Cost price</label>
<input id="cost" type="number" min="0" step="any" placeholder="Enter cost price">
<label for="selling">Selling price</label>
<input id="selling" type="number" min="0" step="any" placeholder="Enter selling price">
<div class="results" aria-live="polite">
<div class="result"><span>Profit</span><span class="value" id="profit">—</span></div>
<div class="result"><span>Profit margin</span><span class="value" id="margin">—</span></div>
<div class="result"><span>Markup</span><span class="value" id="markup">—</span></div>
</div>
</section>
</main>
<footer>© 2026 Toolora. All rights reserved.</footer>
<script>
const cost=document.getElementById("cost");
const selling=document.getElementById("selling");
function calculate(){
const c=Number(cost.value);
const s=Number(selling.value);
const profit=document.getElementById("profit");
const margin=document.getElementById("margin");
const markup=document.getElementById("markup");
if(cost.value.trim()===""||selling.value.trim()===""){
profit.textContent=margin.textContent=markup.textContent="Enter both prices";
return;
}
if(c<0||s<0){
profit.textContent=margin.textContent=markup.textContent="Use non-negative prices";
return;
}
profit.textContent= (s-c).toFixed(2);
margin.textContent=s>0?((s-c)/s*100).toFixed(2)+"%":"Not available (zero selling price)";
markup.textContent=c>0?((s-c)/c*100).toFixed(2)+"%": "Not available (zero cost)";
}
cost.addEventListener("input",calculate);
selling.addEventListener("input",calculate);
</script>
</body>
</html>
